<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed CSS Animation</title>
  <style>
    /* FIX: Force parent containers to have a real height mapping */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    section {
      width: 100%;
      height: 50%;
      background-color: red;
      /* Optional FIX: Keeps animated content from spilling out of the screen layout */
      overflow: hidden; 
    }

    div {
      position: relative;
      top: 50px;
      background-color: yellow;
      width: 15%;
      height: 25%;
      /* FIX: Added 'forwards' so it stops on the violet color at the end */
      animation: moveRight 3s forwards; 
    }

    @keyframes moveRight {
      0% {
        background-color: green;
        transform: translateX(0%);
      }
      50% {
        background-color: white;
        transform: translateX(150%);
      }
      100% {
        background-color: violet;
        transform: translateX(300%);
      }
    }
  </style>
</head>
<body>

  <!-- Your working layout -->
  <section>
    <div></div>
  </section>

</body>
</html>
